name: Refresh Amazon specs

# Amazon changes its Ads API specs without notice. Weekly, re-download every spec,
# regenerate the operation catalog and the generated docs pages, and when anything
# changed and the checks pass, commit the result straight to main, so new endpoints and
# media type versions reach the library without anyone having to act on them.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write # push the refreshed catalog to main
  actions: write # start the docs deploy, see the last step

concurrency:
  group: specs-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-extras
      - run: uv run python scripts/fetch_specs.py
      - run: uv run python scripts/generate_catalog.py
      # CI does not run on this job's push (see the last step), so run here the checks CI
      # applies to generated files. A refresh that fails any of them pushes nothing, and
      # the failed run is the signal to look: for example a catalog.CORRECTIONS entry
      # whose operation Amazon renamed.
      - run: uv run pytest
      - run: uv run python scripts/check_em_dashes.py
      - run: uv run mkdocs build --strict
      - name: Commit to main if anything changed
        id: commit
        run: |
          git add src/amazon_ads/_generated docs
          if git diff --cached --quiet; then
            echo "Amazon's specs produced the same catalog; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The commit body lists added and removed operations, which is what a reviewer
          # needs to decide whether a typed resource has to follow.
          uv run python - > "$RUNNER_TEMP/message.txt" <<'EOF'
          import json, subprocess
          path = "src/amazon_ads/_generated/catalog.json"
          before = json.loads(subprocess.run(
              ["git", "show", f"HEAD:{path}"], capture_output=True, text=True, check=True
          ).stdout)
          after = json.load(open(path))
          old = {e["id"]: e for e in before["operations"]}
          new = {e["id"]: e for e in after["operations"]}
          added, removed = sorted(new.keys() - old.keys()), sorted(old.keys() - new.keys())
          changed = sorted(i for i in new.keys() & old.keys() if new[i] != old[i])
          print("Refresh the operation catalog from Amazon's published specs\n")
          print(f"{len(new)} operations: {len(added)} added, {len(removed)} removed, "
                f"{len(changed)} changed.\n")
          for i in added:
              print(f"+ {i} ({new[i]['method']} {new[i]['path']})")
          for i in removed:
              print(f"- {i}")
          for i in changed:
              print(f"~ {i}")
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -F "$RUNNER_TEMP/message.txt"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # A push made with the workflow's own GITHUB_TOKEN starts no other workflow, so the
      # Docs workflow would not redeploy the coverage page until the next human push.
      # workflow_dispatch is the one event that token is allowed to trigger.
      - name: Redeploy the docs site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
