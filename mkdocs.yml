site_name: amazon-ads-py
site_description: Typed Python client, CLI and MCP server for the Amazon Ads API
site_url: https://anthonyblazejack.github.io/amazon-ads-py/
repo_url: https://github.com/anthonyblazejack/amazon-ads-py
repo_name: anthonyblazejack/amazon-ads-py
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            members_order: source
            docstring_style: google
            show_root_heading: true
            merge_init_into_class: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Authentication and regions: guide/authentication.md
      - Campaign management: guide/campaign-management.md
      - Change plans and rollback: guide/change-plans.md
      - Suggested bids: guide/suggested-bids.md
      - Change history: guide/change-history.md
      - Reports: guide/reports.md
      - Warehouse: guide/warehouse.md
      - Any endpoint: guide/any-endpoint.md
      - Errors and throttling: guide/errors-and-throttling.md
      - API quirks: guide/quirks.md
  - CLI: cli.md
  - MCP server: mcp.md
  - Reference:
      - Python API: reference/api.md
      - API coverage: reference/coverage.md
  - Development: development.md
  - Changelog: changelog.md
