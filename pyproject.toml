[project]
name = "amazon-ads-py"
version = "0.1.0"
description = "A typed Python client, CLI and MCP server for the Amazon Ads API: full endpoint coverage, safe batch writes with rollback plans, and report pulling that outlives Amazon's retention window."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Anthony Jack" }]
requires-python = ">=3.11"
keywords = ["amazon", "amazon-ads", "advertising", "sponsored-products", "kdp", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
cli = ["click>=8.1"]
mcp = ["mcp>=2.0"]
pandas = ["pandas>=2.0"]
all = ["amazon-ads-py[cli,mcp,pandas]"]

[project.scripts]
adsctl = "amazon_ads.cli:main"
amazon-ads-mcp = "amazon_ads.mcp.server:main"

[project.urls]
Homepage = "https://github.com/anthonyblazejack/amazon-ads-py"
Documentation = "https://anthonyblazejack.github.io/amazon-ads-py/"
Issues = "https://github.com/anthonyblazejack/amazon-ads-py/issues"
Changelog = "https://github.com/anthonyblazejack/amazon-ads-py/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
    "types-pyyaml",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "click>=8.1",
    "mcp>=2.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amazon_ads"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"src/amazon_ads/_generated/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["amazon_ads"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: calls the real Amazon Ads API; needs AMAZON_ADS_* credentials (deselected by default)"]
